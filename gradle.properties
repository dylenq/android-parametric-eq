org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true
org.gradle.caching=false
# Maven runs at about 30 KB/s on this Mac, so use long HTTP timeouts and retries.
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
