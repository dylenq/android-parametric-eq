# NOTE: this workflow has NEVER RUN. It was only validated statically (YAML parse and
# scripts/check-workflow.sh); no GitHub repository exists yet. Assumptions that a first run
# may disprove: the cmdline-tools path on the runner, sdkmanager licence handling, the
# cargo-ndk install time, and Gradle finding cargo in ~/.cargo/bin. It creates a DRAFT
# release so a human inspects the APK before anything is public.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Assumption: sdkmanager lives in $ANDROID_HOME/cmdline-tools/latest/bin on runner images.
      # The runner ships NDK 27.3, 29 and 30 only; app/build.gradle.kts pins 27.1.12297006.
      - name: Install the pinned NDK, build-tools and platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;27.1.12297006" "build-tools;36.0.0" "platforms;android-37.0"

      # Assumption: rustup and cargo are preinstalled on the runner (cargo-ndk 4.1.2 is the
      # version used since Phase 1).
      - name: Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2

      - name: Check the tag matches versionName
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION"
          if [ "v$VERSION" != "$TAG_NAME" ]; then
            echo "tag $TAG_NAME does not match versionName v$VERSION" >&2
            exit 1
          fi

      - name: Decode the keystore
        env:
          KEYSTORE_B64: ${{ secrets.EQ_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "the EQ_KEYSTORE_BASE64 secret is empty or not set" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        env:
          EQ_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          EQ_KEYSTORE_PASSWORD: ${{ secrets.EQ_KEYSTORE_PASSWORD }}
          EQ_KEY_ALIAS: ${{ secrets.EQ_KEY_ALIAS }}
        run: bash scripts/release-apk.sh

      - name: Refuse a TESTSIGNED build
        run: |
          if ls build/release/*TESTSIGNED* > /dev/null 2>&1; then
            echo "a TESTSIGNED file exists in build/release" >&2
            exit 1
          fi
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          test -f "build/release/EQ-${VERSION}.apk"

      - name: Create a draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: build/release/EQ-*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
